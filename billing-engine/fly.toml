# fly.toml — STOURS / Rihla Billing Engine
# App: stours-billing  |  Region: cdg (Paris)

app = "stours-billing"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT        = "3100"
  NODE_ENV    = "production"

[http_service]
  internal_port       = 3100
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    grace_period = "15s"
    interval     = "20s"
    method       = "GET"
    path         = "/health"
    port         = 3100
    timeout      = "5s"
    type         = "http"
