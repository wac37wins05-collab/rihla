# fly.toml — STOURS / Rihla Frontend
# App: stours-app  |  Region: cdg (Paris)

app = "stours-app"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL     = "https://stours-api.fly.dev"
    VITE_BILLING_URL = "https://stours-billing.fly.dev"

[env]
  BACKEND_URL = "https://stours-api.fly.dev"
  BILLING_URL = "https://stours-billing.fly.dev"

[http_service]
  internal_port       = 80
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    grace_period = "5s"
    interval     = "15s"
    method       = "GET"
    path         = "/health"
    port         = 80
    timeout      = "3s"
    type         = "http"
