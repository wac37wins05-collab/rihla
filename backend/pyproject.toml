[project]
name = "rihla-backend"
version = "0.7.0"
description = "RIHLA Tourist Platform - Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.30",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.3.4",
    "anthropic==0.29.0",
    "httpx==0.27.0",
    "reportlab==4.1.0",
    "python-pptx==0.6.23",
    "python-docx>=1.1.2",
    "openpyxl==3.1.2",
    "redis>=5.0.4",
    "rank-bm25==0.2.2",
    "orjson>=3.10.0",
    "python-dotenv==1.0.1",
    "sentry-sdk[fastapi]==2.8.0",
    "python-json-logger==3.2.1",
    "slowapi==0.1.9",
    "stripe>=9.5.0,<10",
    "msal>=1.31.0,<2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
